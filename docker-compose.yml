version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgresql://medmon:medmon@db:5432/medmon}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=medmon
      - POSTGRES_PASSWORD=medmon
      - POSTGRES_DB=medmon
    volumes:
      - medmon_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  medmon_pgdata:
